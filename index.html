<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>TerraPulse</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #nasa-eyes {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
      background: #000;
      opacity: 0;
      visibility: hidden;
      transition: opacity .35s ease;
    }
    #nasa-eyes.ready {
      opacity: 1;
      visibility: visible;
    }

    #startup-shield {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 900000;
      opacity: 1;
      visibility: visible;
      transition: opacity .28s ease, visibility .28s ease;
      pointer-events: none;
    }
    #startup-shield.hide {
      opacity: 0;
      visibility: hidden;
    }

    .custom-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 145px;
      display: flex;
      align-items: center;
      padding: 0 48px;
      background: #000;
      border-bottom: 1px solid rgba(255,255,255,.08);
      z-index: 1000000;
    }
    .brand-name {
      color: #fff;
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .2px;
      margin-right: 54px;
      white-space: nowrap;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 42px;
    }
    .nav button {
      appearance: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 10px 0;
      font-size: 19px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      opacity: .96;
    }
    .nav button:hover,
    .nav button:focus-visible {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 7px;
    }

    #our-fullscreen {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 60px;
      height: 60px;
      border: 0;
      outline: 0;
      padding: 0;
      margin: 0;
      display: grid;
      place-items: center;
      background: #070a10;
      color: #fff;
      cursor: pointer;
      z-index: 1000001;
    }
    #our-fullscreen:hover { background: #10151e; }
    #our-fullscreen svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    :fullscreen .custom-header { display: flex; }
    :fullscreen #our-fullscreen { display: grid; }


    /* ---------------------------------------------------------
       TERRAPULSE VITAL SIGNS PANEL
       Recreates the useful Vital Signs browser from the supplied
       NASA Eyes screenshots, while keeping the rest of the site unchanged.
       --------------------------------------------------------- */
    #vitals-overlay {
      position: fixed;
      inset: 145px 0 0 0;
      z-index: 999999;
      background: #0b111d;
      color: #fff;
      display: none;
      overflow: auto;
    }

    #vitals-overlay.open {
      display: block;
    }

    .vitals-topbar {
      position: sticky;
      top: 0;
      z-index: 4;
      min-height: 82px;
      background: #182134;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 34px;
    }

    .vitals-title {
      display: flex;
      align-items: center;
      gap: 13px;
      font-size: 27px;
      font-weight: 500;
    }

    .layers-icon {
      width: 24px;
      height: 24px;
      position: relative;
    }

    .layers-icon::before,
    .layers-icon::after,
    .layers-icon span {
      content: "";
      position: absolute;
      left: 1px;
      right: 1px;
      height: 8px;
      border: 2px solid #fff;
      transform: rotate(30deg) skewX(-30deg) scaleY(.55);
    }

    .layers-icon::before { top: 1px; }
    .layers-icon span { top: 7px; }
    .layers-icon::after { top: 13px; }

    .vitals-tabs {
      align-self: stretch;
      display: flex;
      gap: 18px;
      align-items: stretch;
    }

    .vitals-tab {
      appearance: none;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #89a8c9;
      padding: 0 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .vitals-tab.active {
      color: #fff;
      border-bottom-color: #49a8ff;
    }

    .vitals-close {
      justify-self: end;
      border: 0;
      background: transparent;
      color: #fff;
      width: 52px;
      height: 52px;
      font-size: 44px;
      line-height: 1;
      cursor: pointer;
      opacity: .9;
    }

    .vitals-close:hover { opacity: 1; }

    .vitals-content {
      max-width: 1500px;
      margin: 0 auto;
      padding: 52px 44px 72px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 34px;
    }

    .vital-card {
      background: transparent;
      border: 0;
      color: inherit;
      text-align: left;
      padding: 0;
      cursor: pointer;
    }

    .vital-card:hover .vital-thumb {
      transform: translateY(-4px) scale(1.02);
    }

    .vital-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      display: block;
      transition: transform .2s ease;
      background: transparent;
    }

    .vital-label {
      margin-top: 12px;
      color: #98a7bb;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }

    .vital-card h3 {
      margin: 44px 0 14px;
      font-size: 23px;
      font-weight: 500;
    }

    .vital-card p {
      margin: 0;
      color: #c3cbd7;
      font-size: 17px;
      line-height: 1.58;
    }

    .vital-linkline {
      display: block;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.12);
      color: #aeb8c6;
      font-size: 15px;
    }

    .more-title {
      margin: 58px 0 20px;
      font-size: 20px;
      color: #fff;
    }

    .more-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .more-vital {
      border: 1px solid rgba(255,255,255,.11);
      background: #121b2a;
      color: #dce6f1;
      border-radius: 8px;
      padding: 16px 14px;
      min-height: 58px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .more-vital:hover {
      border-color: #49a8ff;
      background: #16243a;
    }

    .animation-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 34px;
      padding-top: 42px;
    }

    .animation-item {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .animation-item img {
      width: 100%;
      aspect-ratio: 1.18 / 1;
      object-fit: contain;
      display: block;
      transition: transform .2s ease;
    }

    .animation-item:hover img {
      transform: translateY(-4px) scale(1.025);
    }

    .animation-note {
      margin: 34px auto 0;
      max-width: 760px;
      text-align: center;
      color: #9eacbd;
      line-height: 1.6;
    }

    @media (max-width: 1100px) {
      .featured-grid,
      .animation-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .more-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .vitals-topbar {
        grid-template-columns: 1fr auto;
      }
      .vitals-tabs {
        grid-column: 1 / -1;
        justify-content: center;
        min-height: 54px;
      }
    }

    @media (max-width: 700px) {
      #vitals-overlay {
        inset: 118px 0 0 0;
      }
      .vitals-topbar {
        padding: 0 16px;
      }
      .vitals-title {
        font-size: 22px;
      }
      .vitals-content {
        padding: 30px 18px 55px;
      }
      .featured-grid,
      .animation-grid {
        grid-template-columns: 1fr;
      }
      .more-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .custom-header {
        height: 118px;
        padding: 0 18px;
      }
      .brand-name {
        font-size: 27px;
        margin-right: 26px;
      }
      .nav { gap: 20px; }
      .nav button { font-size: 14px; }
      #our-fullscreen {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>

  <button id="our-fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
    <svg id="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 3H3v5"/>
      <path d="M3 3l6 6"/>
      <path d="M16 3h5v5"/>
      <path d="M21 3l-6 6"/>
      <path d="M8 21H3v-5"/>
      <path d="M3 21l6-6"/>
      <path d="M16 21h5v-5"/>
      <path d="M21 21l-6-6"/>
    </svg>
  </button>

  <script>
    const frame = document.getElementById('nasa-eyes');
    const shield = document.getElementById('startup-shield');
    const homeBtn = document.getElementById('home-btn');
    const vitalsBtn = document.getElementById('vitals-btn');
    const fullscreenBtn = document.getElementById('our-fullscreen');

    const HOME_URL =
      'https://eyes.nasa.gov/apps/earth/#/vitalsign' +
      '?vitalsign=visible_earth' +
      '&altid=0' +
      '&animating=f' +
      '&showOnGlobe=t';

    const VITALS_URL =
      'https://eyes.nasa.gov/apps/earth/#/vitalsign' +
      '?vitalsign=satellites' +
      '&animating=f';

    const SETTLE_DELAY = 6500;
    let revealTimer = null;
    let safetyTimer = null;

    function showFrame() {
      clearTimeout(revealTimer);
      frame.classList.add('ready');
      shield.classList.add('hide');
    }

    function beginHiddenLoad(url) {
      clearTimeout(revealTimer);
      clearTimeout(safetyTimer);

      frame.classList.remove('ready');
      shield.classList.remove('hide');

      frame.src = url;

      safetyTimer = setTimeout(() => {
        showFrame();
      }, 11000);
    }

    frame.addEventListener('load', () => {
      clearTimeout(revealTimer);
      revealTimer = setTimeout(() => {
        showFrame();
      }, SETTLE_DELAY);
    });

    homeBtn.addEventListener('click', () => {
      beginHiddenLoad(HOME_URL);
    });

    const vitalsOverlay = document.getElementById('vitals-overlay');
    const vitalsClose = document.getElementById('vitals-close');
    const tabKey = document.getElementById('tab-key');
    const tabAnimations = document.getElementById('tab-animations');
    const panelKey = document.getElementById('panel-key');
    const panelAnimations = document.getElementById('panel-animations');

    function openVitalsPanel() {
      vitalsOverlay.classList.add('open');
      vitalsOverlay.setAttribute('aria-hidden', 'false');
    }

    function closeVitalsPanel() {
      vitalsOverlay.classList.remove('open');
      vitalsOverlay.setAttribute('aria-hidden', 'true');
    }

    function showVitalTab(which) {
      const keyActive = which === 'key';
      tabKey.classList.toggle('active', keyActive);
      panelKey.classList.toggle('active', keyActive);
      tabAnimations.classList.toggle('active', !keyActive);
      panelAnimations.classList.toggle('active', !keyActive);
    }

    function openVital(vital) {
      closeVitalsPanel();

      if (vital === 'satellites') {
        beginHiddenLoad(VITALS_URL);
        return;
      }

      const url =
        'https://eyes.nasa.gov/apps/earth/#/vitalsign' +
        '?vitalsign=' + encodeURIComponent(vital) +
        '&altid=0' +
        '&animating=f' +
        '&showOnGlobe=t';

      beginHiddenLoad(url);
    }

    vitalsBtn.addEventListener('click', openVitalsPanel);
    vitalsClose.addEventListener('click', closeVitalsPanel);
    tabKey.addEventListener('click', () => showVitalTab('key'));
    tabAnimations.addEventListener('click', () => showVitalTab('animations'));

    document.querySelectorAll('[data-vital]').forEach((el) => {
      el.addEventListener('click', () => openVital(el.dataset.vital));
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && vitalsOverlay.classList.contains('open')) {
        closeVitalsPanel();
      }
    });

    beginHiddenLoad(HOME_URL);

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (err) {
        console.error('Fullscreen request failed:', err);
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreen-icon');
      if (document.fullscreenElement) {
        icon.innerHTML = `
          <path d="M9 9H4V4"/>
          <path d="M4 9l5-5"/>
          <path d="M15 9h5V4"/>
          <path d="M20 9l-5-5"/>
          <path d="M9 15H4v5"/>
          <path d="M4 15l5 5"/>
          <path d="M15 15h5v5"/>
          <path d="M20 15l-5 5"/>
        `;
      } else {
        icon.innerHTML = `
          <path d="M8 3H3v5"/>
          <path d="M3 3l6 6"/>
          <path d="M16 3h5v5"/>
          <path d="M21 3l-6 6"/>
          <path d="M8 21H3v-5"/>
          <path d="M3 21l6-6"/>
          <path d="M16 21h5v-5"/>
          <path d="M21 21l-6-6"/>
        `;
      }
    });
  </script>
