<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>NASA Eyes on the Earth</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #nasa-eyes {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <iframe
    id="nasa-eyes"
    src="https://eyes.nasa.gov/apps/earth/#/"
    title="NASA Eyes on the Earth"
    allow="accelerometer; fullscreen"
    allowfullscreen
    loading="eager">
  </iframe>
</body>
</html>
