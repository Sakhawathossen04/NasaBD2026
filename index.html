<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>TerraPulse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* OUR CLEAN HEADER */
    .custom-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 86px;
      display: flex;
      align-items: center;
      padding: 0 38px;
      background: #000;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
    }

    .brand-name {
      color: #fff;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-right: 42px;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .nav button {
      appearance: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 0;
      opacity: 0.95;
    }

    .nav button:hover {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    /*
      Instead of placing black masks over NASA's header,
      we crop the top part of the embedded NASA page out of view.
    */
    .eyes-viewport {
      position: fixed;
      top: 86px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: #000;
    }

    #nasa-eyes {
      position: absolute;
      left: 0;

      /*
        Move NASA's own top header + startup headline above
        our visible viewport, so no black overlay boxes are needed.
      */
      top: -175px;

      width: 100%;
      height: calc(100% + 175px);

      border: 0;
      display: block;
      background: #000;

      /* Hide NASA startup splash until main view has loaded */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease;
    }

    #nasa-eyes.ready {
      opacity: 1;
      visibility: visible;
    }

    /* Simple clean black screen while NASA loads in background */
    #startup-shield {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 5;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      pointer-events: none;
    }

    #startup-shield.hide {
      opacity: 0;
      visibility: hidden;
    }

    @media (max-width: 800px) {
      .custom-header {
        height: 76px;
        padding: 0 18px;
      }

      .brand-name {
        font-size: 26px;
        margin-right: 24px;
      }

      .nav {
        gap: 18px;
      }

      .nav button {
        font-size: 14px;
      }

      .eyes-viewport {
        top: 76px;
      }

      #nasa-eyes {
        top: -165px;
        height: calc(100% + 165px);
      }
    }
  </style>
</head>

<body>

  <header class="custom-header">
    <div class="brand-name">TerraPulse</div>

    <nav class="nav">
      <button type="button" onclick="reloadMain()">HOME</button>
      <button type="button" onclick="reloadMain()">VITAL SIGNS</button>
    </nav>
  </header>

  <div class="eyes-viewport">
    <iframe
      id="nasa-eyes"
      src="https://eyes.nasa.gov/apps/earth/#/"
      title="NASA Eyes on the Earth"
      allow="accelerometer; fullscreen"
      allowfullscreen
      loading="eager">
    </iframe>

    <div id="startup-shield" aria-hidden="true"></div>
  </div>

  <script>
    const frame = document.getElementById('nasa-eyes');
    const shield = document.getElementById('startup-shield');

    const REVEAL_DELAY = 3200;
    let revealTimer;

    function revealMainView() {
      clearTimeout(revealTimer);

      revealTimer = setTimeout(() => {
        frame.classList.add('ready');
        shield.classList.add('hide');
      }, REVEAL_DELAY);
    }

    frame.addEventListener('load', revealMainView);

    /* Safety fallback */
    setTimeout(() => {
      frame.classList.add('ready');
      shield.classList.add('hide');
    }, 7000);

    function reloadMain() {
      frame.classList.remove('ready');
      shield.classList.remove('hide');
      clearTimeout(revealTimer);

      frame.src = 'https://eyes.nasa.gov/apps/earth/#/';
    }
  </script>

</body>
</html>
